name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/signing.keystore"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing.keystore" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((10 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build signed APK + AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: sh gradlew assembleRelease bundleRelease

      - name: Copy release files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk app-release-signed.apk
          cp android/app/build/outputs/bundle/release/app-release.aab app-release-bundle.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: secretary-tool-apk
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          if-no-files-found: error
